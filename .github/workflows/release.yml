name: Publish Cross-Platform Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write # Grants permission to create releases and upload files

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to '9.0.x' or '10.0.x' if needed

    - name: Restore Dependencies
      run: dotnet restore

    - name: Publish Binaries for All Platforms
      run: |
        # Windows x64 (Produces a single .exe)
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/win-x64
        
        # Linux x64 (Produces a single extensionless binary)
        dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linux-x64
        
        # macOS x64 (Intel)
        dotnet publish -c Release -r osx-x64 --self-contained true /p:PublishSingleFile=true -o ./publish/osx-x64
        
        # macOS ARM64 (Apple Silicon M1/M2/M3)
        dotnet publish -c Release -r osx-arm64 --self-contained true /p:PublishSingleFile=true -o ./publish/osx-arm64

    - name: Package Assets into Zips and Tarballs
      run: |
        mkdir ./artifacts
        
        # Zip the Windows executable folder
        cd publish/win-x64 && zip -r ../../artifacts/windows-x64.zip . && cd ../..
        
        # Tar/Gzip the Linux binary for preserved execution permissions
        cd publish/linux-x64 && tar -czvf ../../artifacts/linux-x64.tar.gz . && cd ../..
        
        # Zip the macOS builds
        cd publish/osx-x64 && zip -r ../../artifacts/macos-x64.zip . && cd ../..
        cd publish/osx-arm64 && zip -r ../../artifacts/macos-arm64.zip . && cd ../..

    - name: Create GitHub Release and Upload Packages
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/windows-x64.zip
          artifacts/linux-x64.tar.gz
          artifacts/macos-x64.zip
          artifacts/macos-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
